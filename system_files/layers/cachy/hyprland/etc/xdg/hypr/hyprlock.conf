# cache22 system-wide hyprlock config. Copy to ~/.config/hypr/hyprlock.conf
# to override. Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = /usr/share/hypr/wall0.png
    blur_passes = 2
    blur_size   = 6
}

input-field {
    monitor          =
    size             = 300, 50
    outline_thickness = 2
    dots_size        = 0.3
    dots_spacing     = 0.3
    outer_color      = rgb(1793d1)
    inner_color      = rgb(1e1e2e)
    font_color       = rgb(cdd6f4)
    fade_on_empty    = false
    placeholder_text = <i>Password</i>
    position         = 0, -80
    halign           = center
    valign           = center
}

label {
    monitor    =
    text       = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size  = 64
    color      = rgb(cdd6f4)
    position   = 0, 120
    halign     = center
    valign     = center
}

label {
    monitor   =
    text      = $USER
    font_size = 16
    color     = rgb(a6adc8)
    position  = 0, -20
    halign    = center
    valign    = center
}
