# cache22 system-wide Hyprland config.
#
# Hyprland searches, in order: $XDG_CONFIG_HOME/hypr/, ~/.config/hypr/,
# $XDG_CONFIG_DIRS entries, then /etc/xdg/hypr/. A user config wins over
# this file, so the supported way to customize is:
#
#   mkdir -p ~/.config/hypr && cp /etc/xdg/hypr/hyprland.conf ~/.config/hypr/
#
# Full option reference: https://wiki.hypr.land/Configuring/
#
# Hyprland also reads hyprland.lua, and a lua config anywhere in the
# search path wins over every hyprland.conf. Pick one format, not both.

# ─── Programs ─────────────────────────────────────────────
$terminal    = kitty
$fileManager = thunar
$menu        = rofi -show drun
$browser     = firefox
$mainMod     = SUPER

# ─── Monitors ─────────────────────────────────────────────
# Auto-detect everything. `nwg-displays` writes per-monitor lines for you;
# see https://wiki.hypr.land/Configuring/Monitors/ for the syntax.
monitor = , preferred, auto, auto

# ─── Environment ──────────────────────────────────────────
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ─── Autostart ────────────────────────────────────────────
# The systemd user manager and the session D-Bus need the Wayland
# variables before anything they activate (portals, the polkit agent,
# screen sharing) can talk to the compositor.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprpolkitagent

exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = fcitx5 -d
exec-once = gnome-keyring-daemon --start --components=secrets,ssh
exec-once = xdg-user-dirs-update

# Hyprland has no XDG-autostart handling, so clipboard history is started
# here rather than by a .desktop file in /etc/xdg/autostart.
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ─── Look and feel ────────────────────────────────────────
general {
    gaps_in           = 4
    gaps_out          = 8
    border_size       = 2
    col.active_border = rgba(1793d1ee) rgba(33ccffee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border  = true
    layout            = dwindle
    allow_tearing     = false
}

decoration {
    rounding         = 8
    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size    = 4
        passes  = 2
    }

    shadow {
        enabled = true
        range   = 4
        color   = rgba(1a1a1aee)
    }
}

# Defaults are good; see https://wiki.hypr.land/Configuring/Animations/
animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ─── Input ────────────────────────────────────────────────
input {
    # Keyboard layout. Change to your own, e.g. `kb_layout = de` or
    # `kb_layout = us,ru` with `kb_options = grp:alt_shift_toggle`.
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
    }
}

# Three-finger horizontal swipe changes workspace.
gesture = 3, horizontal, workspace

# ─── Window rules ─────────────────────────────────────────
windowrule = suppress_event maximize, match:class .*
windowrule = float true, match:class ^(pavucontrol|blueman-manager|nwg-look|nwg-displays)$
windowrule = float true, match:title ^(Open File|Save File|Choose Files)$

layerrule = blur true, match:namespace waybar
layerrule = blur true, match:namespace swaync-control-center
layerrule = blur true, match:namespace swaync-notification-window

# ─── Keybinds ─────────────────────────────────────────────
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, W, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Screenshots. hyprshot writes to ~/Pictures by default.
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = , Print,          exec, hyprshot -m output
bind = $mainMod, Print,  exec, hyprshot -m window

# Focus.
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows.
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspaces.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S,      togglespecialworkspace, magic
bind = $mainMod ALT, S,  movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Mouse: hold SUPER and drag to move (left) or resize (right).
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio, brightness, media. `l` keeps them working while locked,
# `e` lets them repeat when held.
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPause,        exec, playerctl play-pause
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioPrev,         exec, playerctl previous
