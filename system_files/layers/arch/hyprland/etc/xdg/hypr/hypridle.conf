# cache22 system-wide hypridle config. Copy to ~/.config/hypr/hypridle.conf
# to override. Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# hypridle also answers logind's Lock signal, which is what makes
# `loginctl lock-session` (SUPER+L) run hyprlock.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Dim the backlight after 5 minutes. No-op on machines with no backlight.
listener {
    timeout   = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock after 10 minutes.
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# Screen off after 15 minutes.
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend is deliberately not configured here: cache22 runs on servers,
# desktops and laptops from the same image. Add your own listener with
# `on-timeout = systemctl suspend` if you want it.
