# cache22 system-wide hyprpaper config. Copy to ~/.config/hypr/hyprpaper.conf
# to override. Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# wall0/wall1/wall2.png ship with the hyprland package. Point `preload`
# and `wallpaper` at any image you like; the empty field before the comma
# means "all monitors".

preload   = /usr/share/hypr/wall0.png
wallpaper = , /usr/share/hypr/wall0.png

splash = false
