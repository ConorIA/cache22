# composefs deployment backend.
#
# ostree generates a per-deploy .ostree.cfs (an EROFS image of the deploy tree,
# with file data backed by the /ostree/repo object store) at deploy time
# whenever ostree is built with composefs support, which it is. With this
# enabled, ostree-prepare-root mounts that image as a structurally read-only
# root instead of bind-mounting the legacy hardlink-farm checkout.
#
# 'yes': require composefs. Every cache22 deploy carries a .cfs (ostree is built
# with composefs support) and the shipped kernel mounts it, so requiring it costs
# nothing here and keeps the backend unambiguous ('maybe' would let a deploy
# silently fall back to the legacy bind-mount checkout even when composefs is
# actually mounted). To fall back to the legacy bind-mount backend without
# rebuilding, drop an /etc override
# (/etc/ostree/prepare-root.conf with 'enabled = no'); /etc wins over /usr.
# 'signed'/'verity' additionally add fs-verity integrity checking and need a
# signing key (composefs.keypath).
[composefs]
enabled = yes

# /etc stays persistent, NOT transient. ostree sets /etc up as a writable
# overlay (lower = the image's /usr/etc defaults, upper = the per-deploy etc
# the 3-way merge maintains at upgrade), which is the same user-visible
# behavior as the legacy backend. cache22 keeps machine config in /etc
# (extra-cmdline, reboot.conf, ...), so transient (wiped each boot) is wrong.
[etc]
transient = false

# Keep /sysroot writable, matching the legacy backend. composefs makes / a
# read-only EROFS image regardless; /sysroot holds the repo, deploys, and the
# per-stateroot /var, which bootc writes to on upgrade. Left at the legacy
# default to minimize behavior change; it is independent of composefs.enabled.
[sysroot]
readonly = false
