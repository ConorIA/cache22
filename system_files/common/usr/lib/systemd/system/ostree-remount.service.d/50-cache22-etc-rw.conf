# cache22 drop-in: fallback to keep /etc writable on the legacy backend.
#
# Under composefs ostree sets /etc up as a writable overlay, so
# ensure-etc-writable defers. This drop-in stays as a safety net for the legacy
# backend (composefs.enabled = maybe can fall back to it), where ostree-remount
# does not re-establish /etc as a writable bind for the non-transient case.
#
# By piggybacking on ostree-remount via ExecStartPost, we inherit the
# right ordering for free: After=local-fs (so / is mounted) and
# Before=systemd-tmpfiles-setup.service / systemd-rfkill.service /
# local-fs.target (so anything that needs writable /etc waits for us).
# ensure-etc-writable is idempotent and a no-op when /etc is already writable.

[Service]
ExecStartPost=/usr/libexec/cache22/ensure-etc-writable
